tasks.named("test", Test) {
    useJUnitPlatform()
}

/*
 * Horizon-QA in-game tests (dev/CI only, never shipped or published).
 *
 * The `gametest` source set compiles against the mod, its compile classpath and Horizon-QA. Its output is appended
 * to the runServer/runClient classpath (RFG builds that classpath from the `jar` task plus `runtimeClasspath`), where
 * FML's classpath scan feeds @GameTestHolder classes to Horizon-QA. It is not part of `jar`, `reobfJar`,
 * `sourcesJar` or any publication. Horizon-QA itself is a `runtimeOnlyNonPublishable` dependency (dependencies.gradle).
 */
def horizonQa = "com.github.GTNewHorizons:Horizon-QA:0.14.0:dev"

sourceSets {
    gametest {
        java.srcDirs = ["src/gametest/java"]
        resources.srcDirs = ["src/gametest/resources"]
        compileClasspath += files({ sourceSets.main.output }) + files({ sourceSets.main.compileClasspath })
    }
}

// The OpenOS game tests run the documented example scripts themselves, so copy the exact repo files instead of
// hand-kept copies (GS-116 adds the Telemetry Hub example beside the v0.1 snapshot one).
tasks.named("processGametestResources", ProcessResources) {
    from("docs/examples/gregscope-snapshot.lua") {
        into("gregscope-gametest")
    }
    from("docs/examples/gregscope-hub.lua") {
        into("gregscope-gametest")
    }
    // GS-109: RegistryCodecTests decodes the golden registry.dat that tools/gen_fixtures.py writes. Copy the exact
    // unit-test fixture instead of keeping a second copy that could drift.
    from("src/test/resources/fixtures/v1") {
        into("gregscope-gametest/fixtures/v1")
    }
}

configurations {
    // GTNHGradle passes -Xplugin:jabel to every JavaCompile task; give this source set the same processor path.
    gametestAnnotationProcessor.extendsFrom(annotationProcessor)
}

dependencies {
    gametestCompileOnly(horizonQa)
    // ChunkReload clears Hodgepodge's fresh-chunk unload protection through its public hook (beta-3 version).
    gametestCompileOnly("com.github.GTNewHorizons:Hodgepodge:2.7.196:dev")
}

["runServer", "runClient"].each { runTask ->
    tasks.named(runTask) {
        dependsOn("gametestClasses")
        classpath(sourceSets.gametest.output)
        // GregScopeTestHooks are no-ops unless this is set. The dev run tasks always set it, so CI's plain
        // `runServer --mcJvmArgs=...` gets it too (a JavaExec system property, independent of --mcJvmArgs).
        // LifecycleTests.testHooksReachGametestJvm asserts it arrived.
        systemProperty("gregscope.testHooks", "true")
        // GS-109: "the server thread does no file I/O" is an `assert` in NioFileStore, which does nothing without
        // -ea. The dev JVM runs without assertions (observed: RegistryCodecTests logged "assertions are off"), so
        // enable them for GregScope's own packages only - Forge, GT, MUI2 and MC keep running with assertions off,
        // which is how they are shipped and tested. RegistryCodecTests.theServerThreadCannotWriteAFile needs this.
        jvmArgs("-ea:io.github.ldogg123.gregscope...")
    }
}
