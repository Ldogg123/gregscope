name: docs

# The user guide only (userguide/). docs/ holds the design and testing records, which are for people working ON
# GregScope rather than using it, and are deliberately not published.
on:
  push:
    branches: [master]
    paths:
      - 'userguide/**'
      - 'mkdocs.yml'
      - 'userguide-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'userguide/**'
      - 'mkdocs.yml'
      - 'userguide-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: userguide-requirements.txt
      - run: pip install -r userguide-requirements.txt
      # --strict turns a broken internal link or a page missing from the nav into a failure. A docs site whose
      # links rot is worse than no docs site, and this is the only place that would catch it.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only master publishes; a pull request just proves the site still builds.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
