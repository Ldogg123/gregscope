
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    with:
      # Worst case if every Horizon-QA batch hit its timeout is ~306 s (6,130 ticks), plus ~30 s Gradle/Forge boot.
      timeout: 600
      # Horizon-QA in-game tests (src/gametest, dev/CI only). Same inputs GT5-Unofficial uses.
      horizonqa: true
      horizonqa-tests: gregscope
    secrets: inherit
